});
$('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(report, null, 2)); $('status').textContent = '报告已复制'; }
    catch (e) { $('status').textContent = `复制失败：${e.message}`; }
});
$('open-dxf').addEventListener('click', () => {
    $('dxf').src = '/dxf/'; $('dxf').hidden = false;
    $('open-dxf').disabled = true; $('run').disabled = true;
    $('capture').disabled = false; $('close-dxf').disabled = false;
    $('dxf-status').textContent = 'DXF 已打开';
});
$('close-dxf').addEventListener('click', () => {
    $('dxf').src = 'about:blank'; $('dxf').hidden = true;
    $('open-dxf').disabled = false; $('run').disabled = false;
    $('capture').disabled = true; $('close-dxf').disabled = true;
    $('dxf-status').textContent = 'DXF 已关闭';
});
$('capture').addEventListener('click', async () => {
    if (collecting) return;
    collecting = true; $('capture').disabled = true; $('close-dxf').disabled = true;
    $('dxf-status').textContent = '采集中';
    const snapshot = {date: new Date().toISOString(), samples: [], errors: []};
    try {
        const win = $('dxf').contentWindow;
        if (!win.rendEngine?.bootstrapCompleted || !win.rend?.sceneInfo) throw new Error('DXF 引擎尚未就绪');
        snapshot.url = win.location.href;
        snapshot.file = win.document.querySelector('select')?.value;
        snapshot.devicePixelRatio = win.devicePixelRatio;
        snapshot.viewport = {width: win.innerWidth, height: win.innerHeight};
        snapshot.canvas = [...win.document.querySelectorAll('canvas')].map(c => ({width:c.width,height:c.height}));
        snapshot.camera = JSON.parse(JSON.stringify(win.rendEngine.cameraSnapshot || null));
        snapshot.scope = '现有运行时诊断：全局 visible 计数；首颜色分区 indirect 与最多 1024 个 draw 实例；不是完整覆盖率或 atlas 像素校验。60 tick 限流可能返回旧 GPU 快照，以 request/completed tick 为准。';
        const deadline = performance.now() + 10000;
        do {
            const state = await Promise.race([win.rend.sceneInfo(), new Promise((_, reject) => setTimeout(() => reject(new Error('sceneInfo 超时')), 10000))]);
            snapshot.samples.push({date: new Date().toISOString(), state});
            if (!state.text2GlyphInstanceCount) throw new Error('当前图纸没有 Text2 字形，请确认 DXF 已完成加载');
            if (state.text2DiagnosticsReadbackStatus === 'error') throw new Error(state.text2DiagnosticsReadbackError || 'GPU 读回失败');
            if (state.text2DiagnosticsReadbackStatus === 'ready') break;
            await new Promise(resolve => setTimeout(resolve, 100));
        } while (performance.now() < deadline);
        if (snapshot.samples.at(-1)?.state.text2DiagnosticsReadbackStatus !== 'ready') throw new Error('GPU 快照未在 10 秒内就绪');
        $('dxf-status').textContent = `已采集 ${snapshots.length + 1} 份状态`;
    } catch (e) { snapshot.errors.push({name:e.name,message:e.message}); $('dxf-status').textContent = `采集失败：${e.message}`; }
    finally {
        snapshots.push(snapshot);
        if (!report) report = {...baseReport(), status:'scene_only', results:[]};
        report.snapshots = snapshots; render();
        collecting = false; $('capture').disabled = false; $('close-dxf').disabled = false;
    }
});
</script>
</html>
